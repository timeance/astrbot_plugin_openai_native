name: astrbot_plugin_openai_native
display_name: OpenAI 原生能力
short_desc: 为 AstrBot 接入 OpenAI 原生网页搜索、AI 生图、改图与原生 GIF。
desc: >-
  支持在聊天中通过自然语言或命令搜索网页、生成图片、编辑参考图，上游支持时还可生成原生 GIF 动图。
  搜索与生图可分别绑定供应商或手动配置独立 API；内置个人/群组每日额度、后台任务队列、图库管理与诊断日志。
version: v0.1.5
author: OpenAI Native contributors
repo: https://github.com/timeance/astrbot_plugin_openai_native
astrbot_version: ">=4.29.4"
support_platforms:
  - aiocqhttp
social_link: https://github.com/timeance
tags:
  - OpenAI
  - 网页搜索
  - AI 绘图
  - 图片编辑
  - GIF
