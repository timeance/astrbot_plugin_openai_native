name: Plugin checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install isolated test dependencies
        run: python -m pip install -r requirements.txt pytest pytest-asyncio ruff PyYAML
      - name: Lint
        run: python -m ruff check .
      - name: Unit, protocol and bridge contracts (no paid APIs)
        run: python -m pytest -q
      - name: Configuration and metadata consistency
        run: python -m pytest tests/test_schema.py -q

  real-astrbot:
    name: Real AstrBot ${{ matrix.framework.label }} / Linux / Python 3.12
    strategy:
      fail-fast: false
      matrix:
        framework:
          - label: '4.29.4'
            commit: '61335414433db721b3f7ecc93f90deafe0a59d78'
          - label: 'master 6b10af7'
            commit: '6b10af75e118714335aff3aab047bf7689fa1388'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRBOT_COMMIT: ${{ matrix.framework.commit }}
      OPENAI_NATIVE_REAL_ASTRBOT: '1'
      OPENAI_NATIVE_ASTRBOT_RUNTIME: ${{ github.workspace }}/.framework-validation/runtime
      ASTRBOT_ROOT: ${{ github.workspace }}/.framework-validation/runtime
      TMPDIR: ${{ github.workspace }}/.framework-validation/tmp
      PIP_CACHE_DIR: ${{ github.workspace }}/.framework-validation/cache/pip
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated framework directories
        run: mkdir -p "$ASTRBOT_ROOT" "$TMPDIR"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned AstrBot source
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://codeload.github.com/AstrBotDevs/AstrBot/tar.gz/$ASTRBOT_COMMIT" \
            -o .framework-validation/astrbot.tar.gz
          tar -xzf .framework-validation/astrbot.tar.gz -C .framework-validation
          echo "PYTHONPATH=$GITHUB_WORKSPACE/.framework-validation/AstrBot-$ASTRBOT_COMMIT:$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Install only framework import dependencies
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          root = Path(".framework-validation")
          framework = root / ("AstrBot-" + os.environ["ASTRBOT_COMMIT"])
          needed = {
              "aiofiles", "aiohttp", "aiosqlite", "anthropic", "apscheduler", "certifi", "click",
              "cryptography", "deprecated", "docstring-parser", "google-genai", "httpx", "jieba",
              "loguru", "mcp", "openai", "opentelemetry-api", "opentelemetry-sdk", "packaging",
              "pillow", "psutil", "pydantic", "pypdf", "python-socks", "sqlalchemy", "sqlmodel",
              "tenacity", "watchfiles", "websockets",
          }
          # Keep the pinned source's version bounds without installing adapters/vector stores.
          requirements = tomllib.loads((framework / "pyproject.toml").read_text())["project"]["dependencies"]
          selected = [req for req in requirements if re.split(r"[<>=!~\[;\s]", req, maxsplit=1)[0].lower() in needed]
          (root / "framework-import-requirements.txt").write_text("\n".join(selected) + "\n")
          PY
          python -m pip install -r requirements.txt \
            -r .framework-validation/framework-import-requirements.txt \
            rich PyYAML pytest pytest-asyncio
          python -m pip check
      - name: Real framework tool and message-hook registration (no paid APIs)
        working-directory: .framework-validation/runtime
        run: >-
          python -m pytest "$GITHUB_WORKSPACE/tests/test_bridge.py" -q
          --basetemp "$TMPDIR/pytest-real"
          -o "cache_dir=$ASTRBOT_ROOT/cache/pytest"
